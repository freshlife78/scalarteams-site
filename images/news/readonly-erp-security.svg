    <text x="88" y="240" fill="#F8FAFC" font-size="19" font-weight="700">Sender &amp; Tenant Binding</text>
    <line x1="88" y1="258" x2="372" y2="258" stroke="#1B2E4B" stroke-width="1"/>

    <circle cx="96" cy="292" r="4" fill="#60A5FA"/>
