    <circle cx="836" cy="292" r="4" fill="#34D399"/>
    <text x="850" y="297" fill="#CBD5E1" font-size="14">Attaches verified BOL &amp; invoice PDF</text>

    <circle cx="836" cy="332" r="4" fill="#34D399"/>
    <text x="850" y="337" fill="#CBD5E1" font-size="14">Embeds live carrier PRO tracking link</text>

    <circle cx="836" cy="372" r="4" fill="#34D399"/>
    <text x="850" y="377" fill="#CBD5E1" font-size="14">Coordinator reviews &amp; clicks Send</text>
    <text x="850" y="399" fill="#94A3B8" font-size="13.5">in under 10 seconds</text>

    <rect x="828" y="472" width="284" height="34" rx="6" fill="#0D2E2B" stroke="#065F46" stroke-width="1"/>
    <text x="844" y="494" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">✓ 100% human-verified responses</text>
