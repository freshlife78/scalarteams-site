    <text x="472" y="327" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">✓ get_shipment_status(order_id)</text>

    <rect x="458" y="352" width="284" height="36" rx="6" fill="#0D2826" stroke="#10B981" stroke-width="1"/>
    <text x="472" y="375" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">✓ get_invoice_pdf(invoice_id)</text>

    <rect x="458" y="400" width="284" height="36" rx="6" fill="#2A1215" stroke="#EF4444" stroke-width="1"/>
    <text x="472" y="423" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">✕ No credit / refund / bank tools</text>

    <rect x="458" y="472" width="284" height="34" rx="6" fill="#12243F"/>
    <text x="474" y="494" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">DB Role: SELECT ONLY on Replica</text>
  </g>
  <rect x="434" y="160" width="332" height="372" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- Arrow 2 -->
  <line x1="766" y1="346" x2="794" y2="346" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="794,340 804,346 794,352" fill="#10B981"/>

  <!-- Column 3 -->
  <g clip-path="url(#clipCol3)">
    <rect x="804" y="160" width="332" height="372" rx="10" fill="#0A1322" stroke="#10B981" stroke-width="2"/>
    <rect x="804" y="160" width="332" height="4" fill="#10B981"/>
    <rect x="828" y="186" width="196" height="24" rx="4" fill="#0D2E2B"/>
