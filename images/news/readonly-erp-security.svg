    <circle cx="96" cy="332" r="4" fill="#60A5FA"/>
    <text x="110" y="337" fill="#CBD5E1" font-size="14">Binds session to exact customer_id</text>
    <text x="110" y="359" fill="#94A3B8" font-size="13.5">in deterministic application code</text>

    <circle cx="96" cy="397" r="4" fill="#60A5FA"/>
    <text x="110" y="402" fill="#CBD5E1" font-size="14">LLM cannot override tenant scope</text>

    <rect x="88" y="472" width="284" height="34" rx="6" fill="#0F1D33"/>
    <text x="104" y="494" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Zero cross-customer data leakage</text>
  </g>
  <rect x="64" y="160" width="332" height="372" rx="10" fill="none" stroke="#2B4263" stroke-width="2"/>

  <!-- Arrow 1 -->
  <line x1="396" y1="346" x2="424" y2="346" stroke="#3B82F6" stroke-width="2.5"/>
  <polygon points="424,340 434,346 424,352" fill="#3B82F6"/>

  <!-- Column 2 -->
  <g clip-path="url(#clipCol2)">
