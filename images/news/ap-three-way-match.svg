<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#0F1E36"/>
    </linearGradient>
    <clipPath id="clipIn1"><rect x="64" y="160" width="310" height="112" rx="10"/></clipPath>
    <clipPath id="clipIn2"><rect x="64" y="292" width="310" height="112" rx="10"/></clipPath>
    <clipPath id="clipIn3"><rect x="64" y="424" width="310" height="112" rx="10"/></clipPath>
    <clipPath id="clipMid"><rect x="432" y="185" width="336" height="326" rx="10"/></clipPath>
    <clipPath id="clipOut1"><rect x="826" y="175" width="310" height="162" rx="10"/></clipPath>
    <clipPath id="clipOut2"><rect x="826" y="365" width="310" height="162" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="600" fill="#070E1A"/>
  <rect x="28" y="28" width="1144" height="544" rx="14" fill="url(#bgGrad)" stroke="#1E3452" stroke-width="2"/>

  <!-- Header -->
  <rect x="64" y="58" width="390" height="26" rx="5" fill="#132847" stroke="#254675" stroke-width="1"/>
  <text x="78" y="75" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">FINANCE &amp; ERP CONTROLS · AUTOMATED 3-WAY MATCH</text>
  <text x="64" y="118" fill="#F8FAFC" font-size="25" font-weight="700">Vision-LLM Invoice Parsing &amp; NetSuite / QuickBooks Voucher Staging</text>
  <line x1="64" y1="138" x2="1136" y2="138" stroke="#1E3452" stroke-width="1.5"/>

  <!-- Left Input 1 -->
  <g clip-path="url(#clipIn1)">
    <rect x="64" y="160" width="310" height="112" rx="10" fill="#0A1322" stroke="#2B4263" stroke-width="2"/>
    <rect x="64" y="160" width="5" height="112" fill="#3B82F6"/>
    <rect x="86" y="178" width="212" height="22" rx="4" fill="#12243F"/>
    <text x="96" y="193" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">DOC 01 · PURCHASE ORDER</text>
    <text x="86" y="224" fill="#F8FAFC" font-size="16" font-weight="700">Approved ERP Purchase Order</text>
    <text x="86" y="248" fill="#94A3B8" font-size="13">Contracted SKUs, unit costs &amp; payment terms</text>
  </g>
  <rect x="64" y="160" width="310" height="112" rx="10" fill="none" stroke="#2B4263" stroke-width="2"/>

  <!-- Left Input 2 -->
  <g clip-path="url(#clipIn2)">
    <rect x="64" y="292" width="310" height="112" rx="10" fill="#0A1322" stroke="#2B4263" stroke-width="2"/>
    <rect x="64" y="292" width="5" height="112" fill="#3B82F6"/>
    <rect x="86" y="310" width="224" height="22" rx="4" fill="#12243F"/>
    <text x="96" y="325" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">DOC 02 · WAREHOUSE RECEIPT</text>
    <text x="86" y="356" fill="#F8FAFC" font-size="16" font-weight="700">Signed BOL / WMS Item Receipt</text>
    <text x="86" y="380" fill="#94A3B8" font-size="13">Actual cases received, weight &amp; dock sign-off</text>
  </g>
  <rect x="64" y="292" width="310" height="112" rx="10" fill="none" stroke="#2B4263" stroke-width="2"/>

  <!-- Left Input 3 -->
  <g clip-path="url(#clipIn3)">
    <rect x="64" y="424" width="310" height="112" rx="10" fill="#0A1322" stroke="#3B82F6" stroke-width="2"/>
    <rect x="64" y="424" width="5" height="112" fill="#60A5FA"/>
    <rect x="86" y="442" width="218" height="22" rx="4" fill="#152C4F"/>
    <text x="96" y="457" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">DOC 03 · VENDOR INVOICE PDF</text>
    <text x="86" y="488" fill="#F8FAFC" font-size="16" font-weight="700">Vision-LLM Line-Item Parse</text>
    <text x="86" y="512" fill="#94A3B8" font-size="13">Extracts billed quantities, rates &amp; freight fees</text>
  </g>
  <rect x="64" y="424" width="310" height="112" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- Connectors Left to Center -->
  <path d="M374 216 L403 216 L403 348 L424 348" fill="none" stroke="#3B82F6" stroke-width="2.2"/>
  <path d="M374 348 L424 348" fill="none" stroke="#3B82F6" stroke-width="2.2"/>
  <path d="M374 480 L403 480 L403 348 L424 348" fill="none" stroke="#3B82F6" stroke-width="2.2"/>
  <polygon points="422,342 432,348 422,354" fill="#3B82F6"/>

  <!-- Center Matching Engine -->
  <g clip-path="url(#clipMid)">
    <rect x="432" y="185" width="336" height="326" rx="10" fill="#0A1322" stroke="#3B82F6" stroke-width="2"/>
    <rect x="432" y="185" width="336" height="4" fill="#60A5FA"/>
    <rect x="456" y="210" width="236" height="22" rx="4" fill="#152C4F"/>
    <text x="466" y="225" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">DETERMINISTIC RECONCILIATION</text>
    <text x="456" y="260" fill="#F8FAFC" font-size="19" font-weight="700">Line-by-Line 3-Way Match</text>
    <line x1="456" y1="278" x2="744" y2="278" stroke="#1B2E4B" stroke-width="1"/>

    <circle cx="464" cy="308" r="4" fill="#60A5FA"/>
    <text x="478" y="313" fill="#CBD5E1" font-size="14">Vendor SKU mapped to ERP Item ID</text>

    <circle cx="464" cy="346" r="4" fill="#60A5FA"/>
    <text x="478" y="351" fill="#CBD5E1" font-size="14">Quantity billed vs. dock quantity received</text>

    <circle cx="464" cy="384" r="4" fill="#60A5FA"/>
    <text x="478" y="389" fill="#CBD5E1" font-size="14">Unit price vs. contracted PO unit price</text>

    <circle cx="464" cy="422" r="4" fill="#60A5FA"/>
    <text x="478" y="427" fill="#CBD5E1" font-size="14">Freight &amp; fuel surcharge GL allocation</text>

    <rect x="456" y="456" width="288" height="30" rx="5" fill="#0F1D33"/>
    <text x="470" y="476" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Tolerance Gate: ±0.5% or $25 max</text>
  </g>
  <rect x="432" y="185" width="336" height="326" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- Connectors Center to Right -->
  <path d="M768 310 L797 310 L797 256 L818 256" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="816,250 826,256 816,262" fill="#10B981"/>

  <path d="M768 386 L797 386 L797 446 L818 446" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="816,440 826,446 816,452" fill="#F59E0B"/>

  <!-- Outcome 1: Match -->
  <g clip-path="url(#clipOut1)">
    <rect x="826" y="175" width="310" height="162" rx="10" fill="#0A1322" stroke="#10B981" stroke-width="2"/>
    <rect x="826" y="175" width="310" height="4" fill="#10B981"/>
    <rect x="848" y="198" width="236" height="22" rx="4" fill="#0D2E2B"/>
    <text x="858" y="213" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">MATCH WITHIN TOLERANCE (80-85%)</text>
    <text x="848" y="248" fill="#F8FAFC" font-size="17" font-weight="700">Stage Draft Bill in ERP</text>
    <line x1="848" y1="264" x2="1114" y2="264" stroke="#1B2E4B" stroke-width="1"/>
    <text x="848" y="290" fill="#CBD5E1" font-size="13.5">Voucher staged in NetSuite / QuickBooks</text>
    <text x="848" y="312" fill="#94A3B8" font-size="13">Queued for Controller batch payment sign-off</text>
  </g>
  <rect x="826" y="175" width="310" height="162" rx="10" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- Outcome 2: Variance -->
  <g clip-path="url(#clipOut2)">
    <rect x="826" y="365" width="310" height="162" rx="10" fill="#0A1322" stroke="#F59E0B" stroke-width="2"/>
    <rect x="826" y="365" width="310" height="4" fill="#F59E0B"/>
    <rect x="848" y="388" width="204" height="22" rx="4" fill="#2E210D"/>
    <text x="858" y="403" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">VARIANCE FLAGGED (15-20%)</text>
    <text x="848" y="438" fill="#F8FAFC" font-size="17" font-weight="700">AP Specialist Exception Queue</text>
    <line x1="848" y1="454" x2="1114" y2="454" stroke="#1B2E4B" stroke-width="1"/>
    <text x="848" y="480" fill="#CBD5E1" font-size="13.5">Short-ship, damaged cases, or price</text>
    <text x="848" y="502" fill="#94A3B8" font-size="13">discrepancy routed for vendor credit memo</text>
  </g>
  <rect x="826" y="365" width="310" height="162" rx="10" fill="none" stroke="#F59E0B" stroke-width="2"/>
</svg>
