<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#0F1E36"/>
    </linearGradient>
    <clipPath id="clipCol1"><rect x="64" y="160" width="332" height="372" rx="10"/></clipPath>
    <clipPath id="clipCol2"><rect x="434" y="160" width="332" height="372" rx="10"/></clipPath>
    <clipPath id="clipCol3"><rect x="804" y="160" width="332" height="372" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="600" fill="#070E1A"/>
  <rect x="28" y="28" width="1144" height="544" rx="14" fill="url(#bgGrad)" stroke="#1E3452" stroke-width="2"/>

  <!-- Header -->
  <rect x="64" y="58" width="420" height="26" rx="5" fill="#132847" stroke="#254675" stroke-width="1"/>
  <text x="78" y="75" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">MODEL RELEASE ARCHITECTURE · CONSTRAINED DECODING</text>
  <text x="64" y="118" fill="#F8FAFC" font-size="25" font-weight="700">How Grammar-Constrained Token Sampling Guarantees 100% Schema Compliance</text>
  <line x1="64" y1="138" x2="1136" y2="138" stroke="#1E3452" stroke-width="1.5"/>

  <!-- Column 1: Schema -->
  <g clip-path="url(#clipCol1)">
    <rect x="64" y="160" width="332" height="372" rx="10" fill="#0A1322" stroke="#2B4263" stroke-width="2"/>
    <rect x="64" y="160" width="332" height="4" fill="#3B82F6"/>
    <rect x="88" y="186" width="218" height="24" rx="4" fill="#12243F"/>
    <text x="100" y="202" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">01 · PYDANTIC / ZOD SCHEMA</text>
    <text x="88" y="240" fill="#F8FAFC" font-size="19" font-weight="700">Strict ERP Voucher Contract</text>
    <line x1="88" y1="258" x2="372" y2="258" stroke="#1B2E4B" stroke-width="1"/>

    <rect x="88" y="274" width="284" height="232" rx="6" fill="#070E1A" stroke="#1E293B" stroke-width="1"/>
    <text x="102" y="300" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">class VendorVoucher(BaseModel):</text>
    <text x="102" y="324" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">  vendor_id: str</text>
    <text x="102" y="348" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">  gl_code: Literal[</text>
    <text x="102" y="372" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">    "5100-COGS",</text>
    <text x="102" y="396" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">    "5240-FREIGHT",</text>
    <text x="102" y="420" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">    "6110-COLD-STORAGE"</text>
    <text x="102" y="444" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">  ]</text>
    <text x="102" y="468" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">  total_usd: Decimal</text>
    <text x="102" y="492" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">  needs_review: bool</text>
  </g>
  <rect x="64" y="160" width="332" height="372" rx="10" fill="none" stroke="#2B4263" stroke-width="2"/>

  <!-- Arrow 1 -->
  <line x1="396" y1="346" x2="424" y2="346" stroke="#3B82F6" stroke-width="2.5"/>
  <polygon points="424,340 434,346 424,352" fill="#3B82F6"/>

  <!-- Column 2: CFG Mask -->
  <g clip-path="url(#clipCol2)">
    <rect x="434" y="160" width="332" height="372" rx="10" fill="#0A1322" stroke="#3B82F6" stroke-width="2"/>
    <rect x="434" y="160" width="332" height="4" fill="#60A5FA"/>
    <rect x="458" y="186" width="246" height="24" rx="4" fill="#152C4F"/>
    <text x="470" y="202" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">02 · CONTEXT-FREE GRAMMAR MASK</text>
    <text x="458" y="240" fill="#F8FAFC" font-size="19" font-weight="700">Logit Masking at Decode Step</text>
    <line x1="458" y1="258" x2="742" y2="258" stroke="#1B2E4B" stroke-width="1"/>

    <text x="458" y="288" fill="#CBD5E1" font-size="13.5">At every token step, the inference engine</text>
    <text x="458" y="310" fill="#CBD5E1" font-size="13.5">sets probability = 0 for any token that</text>
    <text x="458" y="332" fill="#CBD5E1" font-size="13.5">violates the compiled JSON grammar:</text>

    <rect x="458" y="356" width="284" height="44" rx="6" fill="#0D2826" stroke="#10B981" stroke-width="1.2"/>
    <text x="474" y="383" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">✓ "5240-FREIGHT" (Allowed)</text>

    <rect x="458" y="414" width="284" height="44" rx="6" fill="#2A1215" stroke="#EF4444" stroke-width="1.2"/>
    <text x="474" y="441" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">✕ "MISC-EXPENSE" (Masked -∞)</text>

    <rect x="458" y="472" width="284" height="34" rx="6" fill="#12243F"/>
    <text x="474" y="494" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">100% Syntactic &amp; Enum Validity</text>
  </g>
  <rect x="434" y="160" width="332" height="372" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- Arrow 2 -->
  <line x1="766" y1="346" x2="794" y2="346" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="794,340 804,346 794,352" fill="#10B981"/>

  <!-- Column 3: Downstream SQL -->
  <g clip-path="url(#clipCol3)">
    <rect x="804" y="160" width="332" height="372" rx="10" fill="#0A1322" stroke="#10B981" stroke-width="2"/>
    <rect x="804" y="160" width="332" height="4" fill="#10B981"/>
    <rect x="828" y="186" width="212" height="24" rx="4" fill="#0D2E2B"/>
    <text x="840" y="202" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">03 · DOWNSTREAM ERP / SQL</text>
    <text x="828" y="240" fill="#F8FAFC" font-size="19" font-weight="700">Deterministic Validation</text>
    <line x1="828" y1="258" x2="1112" y2="258" stroke="#1B2E4B" stroke-width="1"/>

    <circle cx="836" cy="292" r="4" fill="#34D399"/>
    <text x="850" y="297" fill="#CBD5E1" font-size="14">Zero JSON parsing exceptions</text>

    <circle cx="836" cy="332" r="4" fill="#34D399"/>
    <text x="850" y="337" fill="#CBD5E1" font-size="14">Zero hallucinated GL account codes</text>

    <circle cx="836" cy="372" r="4" fill="#34D399"/>
    <text x="850" y="377" fill="#CBD5E1" font-size="14">Deterministic math check verifies</text>
    <text x="850" y="399" fill="#94A3B8" font-size="13.5">sum(line_items) == invoice_total</text>

    <circle cx="836" cy="435" r="4" fill="#34D399"/>
    <text x="850" y="440" fill="#CBD5E1" font-size="14">Low-confidence rows route to human</text>

    <rect x="828" y="472" width="284" height="34" rx="6" fill="#0D2E2B" stroke="#065F46" stroke-width="1"/>
    <text x="844" y="494" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">✓ Safe for ERP API ingestion</text>
  </g>
  <rect x="804" y="160" width="332" height="372" rx="10" fill="none" stroke="#10B981" stroke-width="2"/>
</svg>
